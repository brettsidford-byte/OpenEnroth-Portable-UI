name: Android ARM64 Signed Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Release version, for example 1.1.0
        required: true
        default: 1.1.0
      publish_release:
        description: Publish the signed APK as a GitHub Release
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: android-arm64-release
  cancel-in-progress: false

env:
  NDK_VERSION: 28.1.13356709
  CCACHE_COMPILERCHECK: content
  OE_VERSION_NAME: ${{ inputs.version_name }}

jobs:
  build_android_arm64_release:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.0
        with:
          submodules: recursive

      - name: Configure fast APT mirror
        uses: vegardit/fast-apt-mirror.sh@v1

      - name: Install NDK
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "ndk;$NDK_VERSION"

      - name: Setup Java
        uses: actions/setup-java@v5.0.0
        with:
          distribution: temurin
          java-version: 17.0.6

      - name: Set increasing Android version code
        shell: bash
        run: echo "OE_VERSION_CODE=$((10000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Restore permanent signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/openenroth-portable-ui.jks"

      - name: Run ccache
        uses: hendrikmuhs/ccache-action@v1.2.18
        with:
          key: android-Release-universal
          verbose: 2
          max-size: 800M

      - name: Build signed ARM64 release APK
        uses: burrunan/gradle-cache-action@v3.0.1
        with:
          build-root-directory: android
          job-id: android-Release
          arguments: assembleRelease --info --no-configuration-cache -Pandroid.native.buildOutput=verbose
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 4
          GITHUBARCH: arm64-v8a
          SIGNING_KEYSTORE: ${{ runner.temp }}/openenroth-portable-ui.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify signed APK
        shell: bash
        run: |
          APK=android/openenroth/build/outputs/apk/release/openenroth-release.apk
          test -f "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          cp "$APK" "OpenEnroth-Portable-UI-${OE_VERSION_NAME}-arm64.apk"
          sha256sum "OpenEnroth-Portable-UI-${OE_VERSION_NAME}-arm64.apk" > "OpenEnroth-Portable-UI-${OE_VERSION_NAME}-arm64.apk.sha256"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: openenroth-portable-ui-${{ env.OE_VERSION_NAME }}-arm64-release
          path: |
            OpenEnroth-Portable-UI-${{ env.OE_VERSION_NAME }}-arm64.apk
            OpenEnroth-Portable-UI-${{ env.OE_VERSION_NAME }}-arm64.apk.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ui-v${OE_VERSION_NAME}"
          gh release create "$TAG" \
            "OpenEnroth-Portable-UI-${OE_VERSION_NAME}-arm64.apk" \
            "OpenEnroth-Portable-UI-${OE_VERSION_NAME}-arm64.apk.sha256" \
            --target "$GITHUB_SHA" \
            --title "OpenEnroth Portable UI ${OE_VERSION_NAME}" \
            --generate-notes
